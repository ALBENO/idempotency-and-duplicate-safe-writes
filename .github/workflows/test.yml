   name: test
   on: [push, pull_request]
   jobs:
     test:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-node@v4
           with:
             node-version: 20
         - run: docker compose up -d
         - run: sleep 15
         - run: npm ci
         - run: npm run db:reset
         - run: npm test
